  <style>
    .cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin: 10px;
    }
    .item-card {
    width: 265px;
    height: 320px;
    margin-bottom: 20px;
    }
    .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #ccc;
    box-shadow: 0 2px 2px rgba(0, 0, 0, 0.3);
    border-radius: 0;
    }
    .card-img-container {
    width: 100%;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    }
    .card-img-container img {
    width: 210px;
    height: 210px;
    object-fit: cover;
    border-radius: 0;
    }
    .product-title {
        overflow: hidden;
        width:200px;
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        padding-left: 11%;
        padding-right: 1%;
        padding-top: 4%;
    }
  </style>

  <div class="col-sm-3 item-card cards">
    <div class="card text-center">
      <div class="card-img-container">
        <a href="/app/dashboard-view/{{data.name}} Dashboard" style="text-decoration: none;">
          {% if data.image %}
          <img class="card-img" src="{{data.image}}" alt="No image found">
          {% else %}
          <br>
          <br>
          <br>
          <br>
          <br>
          <br>
          <br>
          <br>
          <br>
          <p>No image found</p>
          {% endif %}
          <hr style="background-color: rgba(143, 143, 143, 0.708); height: 1px; border: none; width: 235px;">
          <div class="product-title">
            {{data.name}}
          </div>
        </a>
      </div>
    </div>
  </div>
